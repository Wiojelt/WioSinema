name: Publish WioSinema v39

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-wiosinema-v39.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-77d4-8243-8c34-ed2fe2e7ac61/raw?se=2026-09-24T22%3A12%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=a7f6a95e-390f-5217-b5a4-56225ecef095&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T21%3A51%3A20Z&ske=2026-09-25T21%3A51%3A20Z&sks=b&skv=2026-02-06&sig=EoSr/xLExtd1KhmsXRwCyEMrapiKrY5MfIxxzS4d7NM%3D"
      EXPECTED_SHA256: "2b4483ed5fa71a739d19952af8f16c749e6bdc0e536faf9b1f987b3183188956"
      EXPECTED_SIZE: "2058345"
      EXPECTED_VERSION: "39"
    steps:
      - name: Download transfer artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o "$RUNNER_TEMP/transfer.zip"
          unzip -q "$RUNNER_TEMP/transfer.zip" -d "$RUNNER_TEMP/stage"

      - name: Verify transfer integrity
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/stage" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          root=Path(sys.argv[1]); expected_version=int(sys.argv[2]); expected_size=int(sys.argv[3]); expected_sha=sys.argv[4]
          cs3=root/"WioSinema.cs3"; plugins=root/"plugins.json"
          data=cs3.read_bytes(); digest=hashlib.sha256(data).hexdigest()
          row=json.loads(plugins.read_text(encoding="utf-8"))[0]
          with zipfile.ZipFile(cs3) as z:
              manifest=json.loads(z.read("manifest.json").decode("utf-8"))
          assert manifest.get("version")==expected_version==row.get("version")
          assert len(data)==expected_size==row.get("fileSize")
          assert digest==expected_sha
          assert row.get("fileHash")=="sha256-"+digest
          row["hash"]=digest; row["name"]="0 WioSinema"
          plugins.write_text(json.dumps([row],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"verified v{expected_version} {len(data)} {digest}")
          PY

      - uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 1

      - name: Publish builds
        id: builds
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/stage/WioSinema.cs3" builds/WioSinema.cs3
          python - builds/plugins.json "$RUNNER_TEMP/stage/plugins.json" <<'PY'
          import json, sys
          from pathlib import Path
          dest=Path(sys.argv[1]); new=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))[0]
          rows=json.loads(dest.read_text(encoding="utf-8"))
          for i,row in enumerate(rows):
              if row.get("internalName")=="WioSinema":
                  rows[i]=new; break
          else:
              rows.insert(0,new)
          dest.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git -C builds config user.name 'github-actions[bot]'
          git -C builds config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C builds add WioSinema.cs3 plugins.json
          if ! git -C builds diff --cached --quiet; then
            git -C builds -c commit.gpgsign=false commit --allow-empty-message -m ""
            git -C builds push origin HEAD:builds
          fi
          echo "sha=$(git -C builds rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Pin repo manifest
        env:
          BUILD_SHA: ${{ steps.builds.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - main/repo.json "$BUILD_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); sha=sys.argv[2]
          d=json.loads(p.read_text(encoding="utf-8"))
          d["pluginLists"]=[f"https://raw.githubusercontent.com/Wiojelt/WioSinema/{sha}/plugins.json"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git -C main config user.name 'github-actions[bot]'
          git -C main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C main add repo.json
          if ! git -C main diff --cached --quiet; then
            git -C main -c commit.gpgsign=false commit --allow-empty-message -m ""
            git -C main push origin HEAD:main
          fi

# publish-trigger
